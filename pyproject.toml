[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marketplace-fraud-detection"
version = "0.1.0"
description = "Human-centred marketplace listing fraud analysis prototype"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0,<4",
    "huggingface_hub>=0.27,<2",
    "torch>=2.2",
    "transformers>=4.44,<5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
marketplace_fraud_detection = ["templates/*", "static/*"]
